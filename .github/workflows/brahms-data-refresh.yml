name: Refresh Brahms performance data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: brahms-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate Brahms performances data
        run: npm run scrape:brahms

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- public/data/brahms-performances.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/brahms-performances.json
          git commit -m "chore: refresh Brahms performance data"
          git push

      - name: Trigger Vercel deploy hook (optional)
        if: secrets.VERCEL_DEPLOY_HOOK_URL != ''
        run: curl -fsSL --retry 3 --retry-delay 2 -X POST "$VERCEL_DEPLOY_HOOK_URL"
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
